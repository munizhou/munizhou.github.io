<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box} html,body{margin:0;background:#fff;color:#102f2e;font-family:Arial,Helvetica,sans-serif}
  .page{width:1600px;padding:18px 24px 28px}
  .label{margin:0 0 8px;font-size:18px;font-weight:700;color:#526b6c}
  .banner{position:relative;width:100%;height:248px;overflow:hidden;background:#fff}
  .art{position:absolute;inset:0;background-image:var(--art);background-size:cover;background-position:center;filter:saturate(.86) contrast(.94)}
  .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.93) 19%,rgba(255,255,255,.70) 34%,rgba(255,255,255,.30) 53%,rgba(255,255,255,.05) 78%,rgba(255,255,255,0) 100%)}
  .title{position:absolute;left:30px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:34px;white-space:nowrap}
  .mark{font-size:78px;line-height:1;font-weight:800;letter-spacing:-3px;color:#006b4f}
  .words{display:flex;flex-direction:column;gap:5px}
  .main{font-size:43px;line-height:1.05;font-weight:760;letter-spacing:-1.5px;color:#102f2e}
  .sub{font-family:Georgia,'Times New Roman',serif;font-size:43px;line-height:1.05;font-style:italic;font-weight:600;color:#006b4f}
</style>
</head>
<body>
<div class="page">
  <div class="label">方案 C</div>
  <section class="banner">
    <div class="art" style="--art:url('option-c-large-small-mix.png')"></div>
    <div class="veil"></div>
    <div class="title"><div class="mark">TAPAS</div><div class="words"><div class="main">Turbulence And Plasmas</div><div class="sub">Across Scales</div></div></div>
  </section>
</div>
</body>
</html>
