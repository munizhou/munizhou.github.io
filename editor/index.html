<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAPAS 本地编辑器</title>
<link rel="stylesheet" href="/editor/editor.css">
<script src="/editor/editor.js" defer></script>
</head>
<body data-editor-token="__TOKEN__">
<header><strong>TAPAS · 本地编辑器</strong><a class="preview" href="/" target="tapas-preview">打开网站预览 ↗</a><button id="save" class="primary">保存并更新预览</button><button id="undo">撤销上次保存</button><button id="export">导出网站 ZIP</button></header>
<div id="status" role="status" aria-live="polite">正在加载…</div>
<main><nav id="nav" aria-label="编辑内容"></nav><section id="form" aria-label="内容表单"></section></main>
<dialog id="media-dialog" aria-labelledby="media-title"><div class="dialog-heading"><h2 id="media-title">选择图片</h2><button id="close-media" aria-label="关闭图片库">关闭</button></div><p id="media-help" class="hint"></p><div id="media-body"></div><footer id="media-footer"></footer></dialog>
</body>
</html>
